name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Build AsciiDoc
        run: |
          sudo apt-get install -y asciidoctor
          mkdir -p _site
          find . -name '*.adoc' -not -path './_site/*' -exec asciidoctor --attribute=nofooter -D _site {} +

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
